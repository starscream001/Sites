<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Редактор · Herbarium</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/admin.css"><script src="/admin/admin.js" defer></script></head><body><header><a class="brand" href="/">❧ Herbarium</a><span>Редактор коллекции</span></header><main class="admin-main"><form id="login"><h1>Вход в редактор</h1><p>Доступ владельца проекта. Пароль задаётся на сервере через ADMIN_PASSWORD.</p><label>Пароль<input type="password" id="password" autocomplete="current-password" required minlength="14"></label><button class="button">Войти →</button></form><div id="editor" hidden><div class="admin-toolbar"><h1>Коллекция</h1><a href="/api/backup" class="text-link" download>Скачать резервную копию</a><button id="logout">Выйти</button></div><p>Изменения публикуются на этом сервере. Для статического хостинга перенесите резервную копию в content/site.json и обновите main.</p><div class="filters"><label>Раздел<select id="collection"><option value="articles">Статьи и главы</option><option value="events">Хронология</option><option value="plants">Растения</option><option value="sources">Источники</option><option value="news">Новости</option><option value="images">Галерея и изображения</option><option value="menu">Меню</option><option value="settings">Настройки</option></select></label><button id="add">Добавить запись</button><label class="import-label">Восстановить JSON<input type="file" accept="application/json,.json" id="restore"></label></div><label>Загрузить изображение (JPEG, PNG, WebP, до 2 МБ)<input type="file" id="upload" accept="image/png,image/jpeg,image/webp"></label><div id="records"></div><button class="button publish" id="publish">Сохранить и опубликовать →</button></div><p id="status" role="status" aria-live="polite"></p></main></body></html>
